name: Supabase database activity check

on:
  schedule:
    # Supabase Free pauses after a week with too little database activity.
    # The API probe reads a real application table (not only SELECT 1) every
    # ten minutes. This is a best-effort activity signal; only a paid Supabase
    # plan can guarantee that the platform will never pause the project.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API and perform a database query
        env:
          BACKEND_URL: https://vimj-backend-eqwnplgd6q-el.a.run.app
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if curl --fail --silent --show-error --max-time 90 \
              "$BACKEND_URL/health/ready"; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 20
            fi
          done
          echo "The backend or database readiness check failed after two attempts."
          exit 1
